[package]
name = "tests"
version = "0.9.2"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
http = { workspace = true }
rapira_sapi = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net"] }
tracing = { workspace = true }
# The server.log readers (src/server_log.rs) use it.
serde_json = "1"
# The wire clients (src/wire.rs, src/grpc.rs) are hyper clients for HTTP/1.1, gRPC, gRPC-Web and Connect.
rapira_net = { workspace = true }
base64 = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }

[dev-dependencies]
# The E2E tests (tests/e2e) use it for process control of the spawned rapira binary.
libc = { workspace = true }

# The E2E suite spawns the rapira binary, which forks worker processes, and sends
# many concurrent requests. The e2e feature gates it, so `cargo test --workspace`
# skips it. Build the rapira binary first. Then run the suite alone, for example:
# cargo test -p tests --test e2e --features e2e
[features]
e2e = []

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["e2e"]
