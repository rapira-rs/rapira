[package]
name = "tests"
version = "0.8.1"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
extension_api = { workspace = true }
http = { workspace = true }
php_sys = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
tracing = { workspace = true }
# Capture layer (init_log_capture).
tracing-subscriber = "0.3"

[dev-dependencies]
http-body-util = { workspace = true }
rapira_http = { workspace = true }
rapira_runtime = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# E2E harness (tests/e2e): process control for the spawned rapira binary.
libc = { workspace = true }
# E2E log-format assertions (tests/e2e/logging.rs).
serde_json = "1"

# The spawn-the-binary E2E suite forks worker processes and runs request storms;
# gated behind a feature so `cargo test --workspace` skips it. Run it isolated
# (build the rapira bin first): cargo test -p tests --test e2e --features e2e
[features]
e2e = []

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["e2e"]
