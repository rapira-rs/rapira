[package]
name = "tests"
version = "0.8.1"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
http = { workspace = true }
rapira_sapi = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "net"] }
tracing = { workspace = true }
# Capture layer (init_log_capture).
tracing-subscriber = "0.3"
# App-record helpers (case_results, dispatcher_record).
serde_json = "1"
# The gRPC harness (src/grpc.rs): rapira_grpc behind a channel intake, and hyper clients for gRPC, gRPC-Web and Connect.
rapira_grpc = { workspace = true }
rapira_net = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }

[dev-dependencies]
rapira_http = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# E2E harness (tests/e2e): process control for the spawned rapira binary.
libc = { workspace = true }

# The spawn-the-binary E2E suite forks worker processes and runs request storms;
# gated behind a feature so `cargo test --workspace` skips it. Run it isolated
# (build the rapira bin first): cargo test -p tests --test e2e --features e2e
[features]
e2e = []

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["e2e"]
