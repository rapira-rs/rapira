; Same as shared/php.ini, with the observer API on and the zend_test markers off, so the
; bodies stay readable. PHP tracks the frame chain only when observers are registered.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
max_execution_time = 0
max_input_time = -1
zend.exception_ignore_args = 0
zend_test.observer.enabled = 1
zend_test.observer.observe_all = 1
zend_test.observer.show_output = 0
; Session GC is off. See shared/php.ini.
session.gc_probability = 0
