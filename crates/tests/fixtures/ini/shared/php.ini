; PHP config for tests only. It shows request-level compile and fatal errors in the
; response body, so the integration suite gives the same results with any system
; php.ini. CI's php.ini-production sets display_errors=Off.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
max_execution_time = 0
max_input_time = -1
zend.exception_ignore_args = 0
; The session_start() GC on distro save_path directories, for example
; /var/lib/php/sessions with mode wx, emits a Permission denied notice. The notice
; commits headers and breaks cookie tests.
session.gc_probability = 0