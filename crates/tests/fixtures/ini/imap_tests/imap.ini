; The imap suite sets default_socket_timeout to 17, which differs from the built-in 60, so a test can prove the MINIT snapshot. display_errors Off keeps the RSHUTDOWN notice out of the response bodies.
display_errors = Off
display_startup_errors = On
error_reporting = E_ALL
max_execution_time = 0
max_input_time = -1
default_socket_timeout = 17
session.gc_probability = 0
