openapi: 3.1.0
info:
  title: rapira echo
  version: "1"
  description: The echo app (echo.php) returns the Request as JSON, every byte string in base64. The check rapira_echo in ../hooks.py compares the echo with the sent request.
# The part counts of a positive case stay below the default upload limits (max_files 20, max_parts 1024): maxProperties and maxItems bound them. Generated values are short, far below max_field_size_kb (256) and max_file_size_mb (2).
components:
  responses:
    echo:
      description: The echoed request.
      content:
        application/json: {}
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    trace:
      name: X-Trace
      in: header
      schema:
        type: string
paths:
  /upload/{id}:
    post:
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/trace"
        - name: mode
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, upload]
              # The part names, and so the file names: Schemathesis makes a filename from the part name.
              # Not empty: the contract types FormField::$name and UploadedFile::$name as non-empty-string.
              # No backslash: rapira reads it as a quoted-pair, https://github.com/rapira-rs/rapira/issues/165
              # No control byte other than HTAB: rapira answers 400, https://github.com/rapira-rs/rapira/issues/181
              propertyNames:
                minLength: 1
                pattern: '^[^\x00-\x08\x0a-\x1f\x7f\\]+$'
              # With upload and 4 attachments, at most 5 additional properties of at most 2 parts each: 15 files.
              maxProperties: 8
              properties:
                title:
                  type: string
                tags:
                  type: array
                  maxItems: 4
                  items:
                    type: string
                upload:
                  type: string
                  format: binary
                attachments:
                  type: array
                  maxItems: 4
                  items:
                    type: string
                    format: binary
                meta:
                  type: object
              # Any value. An array becomes one file part per item.
              additionalProperties:
                maxItems: 2
            encoding:
              upload:
                contentType: application/octet-stream
      responses:
        "200":
          $ref: "#/components/responses/echo"
  /raw/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/trace"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          text/plain:
            schema:
              type: string
      responses:
        "200":
          $ref: "#/components/responses/echo"
  /items/{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/trace"
        - name: q
          in: query
          schema:
            type: string
        - name: tags
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          $ref: "#/components/responses/echo"
