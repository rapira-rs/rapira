[package]
name = "rapira_net"
version = "0.9.0"
edition.workspace = true
publish = false
license = "MIT"
description = "Listeners for rapira plugins - bound in the master before the fork, adopted and accepted in each worker"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
rapira_config = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
socket2 = "0.6"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "macros"] }
