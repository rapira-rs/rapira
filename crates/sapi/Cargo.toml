[package]
name = "rapira_sapi"
version = "0.8.1"
edition.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "sync"] }
rapira_net = { workspace = true }
rapira_scoreboard = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
libc = { workspace = true }
# multipart parsing over the buffered body + file-part spooling
memchr = "2"
httparse = "1"
tempfile = "3"

[build-dependencies]
anyhow = { workspace = true }
bindgen = "0"
cc = "1.2"

