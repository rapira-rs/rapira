[package]
name = "rapira_runtime"
version = "0.8.1"
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
rapira_sapi = { workspace = true }
extension_api = { workspace = true }
http = { workspace = true }
# A shared multi-thread runtime drives all extension tasks.
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros"] }
libc = { workspace = true }
# multipart parsing over the buffered body + file-part spooling
memchr = "2"
httparse = "1"
tempfile = "3"
