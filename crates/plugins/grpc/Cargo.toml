[package]
name = "rapira_grpc"
version = "0.8.1"
edition.workspace = true
publish = false
license = "MIT"
description = "gRPC front for rapira - serves unary gRPC, gRPC-Web and Connect calls from PHP"

[lints]
workspace = true

[dependencies]
rapira_sapi = { workspace = true }
rapira_net = { workspace = true }
rapira_config = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
buffa = { workspace = true }
buffa-descriptor = { workspace = true }
connectrpc = { workspace = true }
connectrpc-health = { workspace = true }
connectrpc-reflection = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync"] }
bytes = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }
hyper = { workspace = true }
tower = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
rapira_php_build = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
