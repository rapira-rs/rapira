[package]
name = "rapira_http"
version = "0.10.0"
edition.workspace = true
publish = false
license = "MIT"
description = "The http plugin of rapira - terminates HTTP and answers every request from PHP"

[lints]
workspace = true

[dependencies]
rapira_sapi = { workspace = true }
rapira_net = { workspace = true }
rapira_config = { workspace = true }
rapira_http_middleware = { workspace = true }
rapira_compress = { workspace = true }
rapira_static_files = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["rt", "net", "time", "macros"] }
# The multipart parser uses these crates.
memchr = "2"
httparse = "1"

[build-dependencies]
rapira_php_build = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "io-util"] }
toml = { workspace = true }
