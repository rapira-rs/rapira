[package]
name = "rapira_http"
version = "0.8.1"
edition.workspace = true
publish = false
license = "MIT"
description = "The http plugin of rapira - terminates HTTP and answers every request from PHP"

[lints]
workspace = true

[dependencies]
rapira_sapi = { workspace = true }
rapira_net = { workspace = true }
rapira_config = { workspace = true }
rapira_static_files = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "macros"] }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio", "server", "http1", "server-graceful"] }
tower = { workspace = true }
http-body = "1"
# multipart parsing over the buffered body + file-part spooling
memchr = "2"
httparse = "1"
tempfile = "3"

[build-dependencies]
anyhow = { workspace = true }
rapira_php_build = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "io-util"] }
toml = { workspace = true }
