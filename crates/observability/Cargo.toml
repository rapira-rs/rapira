[package]
name = "rapira_observability"
version = "0.10.0"
edition.workspace = true
publish = false
license = "MIT"
description = "Prometheus metrics and health probes for Rapira worker pools"

[lints]
workspace = true

[dependencies]
rapira_sapi = { workspace = true }
rapira_net = { workspace = true }
rapira_config = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time"] }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio", "server-graceful"] }
