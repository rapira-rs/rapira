[workspace.package]
edition = "2024"

[package]
name = "rapira_core"
version = "0.8.1"
edition.workspace = true
description = "PHP application server with an embedded NTS runtime, HTTP, and unary gRPC"
homepage = "https://rapira.rs"
documentation = "https://rapira.rs/docs/"
repository = "https://github.com/rapira-rs/rapira"
license = "MIT"
readme = "README.md"

[[bin]]
name = "rapira"
path = "src/main.rs"


[workspace]
members = [
    "crates/config",
    "crates/runtime",
    "crates/api",
    "crates/tests",
    "crates/master",
    "crates/net",
    "crates/middleware/static_files",
    "crates/php_sys",
    "crates/scoreboard",
    "crates/plugins/http",
    "crates/plugins/grpc",
]

[workspace.dependencies]
anyhow = "1"
tracing = "0.1"
php_sys = { path = "crates/php_sys" }
rapira_runtime = { path = "crates/runtime" }
rapira_config = { path = "crates/config" }
extension_api = { path = "crates/api" }
rapira_static_files = { path = "crates/middleware/static_files" }
rapira_http = { path = "crates/plugins/http" }
rapira_grpc = { path = "crates/plugins/grpc" }
rapira_master = { path = "crates/master" }
rapira_net = { path = "crates/net" }
rapira_scoreboard = { path = "crates/scoreboard" }
tokio = { version = "1", features = ["sync"] }
bytes = "1"
http = "1"
http-body-util = "0.1"
libc = "0.2"
prost = "0.14"
prost-types = "0.14"
tonic = { git = "https://github.com/grpc/grpc-rust", rev = "a597b92070dc12d2239923821f86391ad857d910", default-features = false, features = ["server", "codegen", "gzip"] }
tonic-prost = { git = "https://github.com/grpc/grpc-rust", rev = "a597b92070dc12d2239923821f86391ad857d910" }
tonic-reflection = { git = "https://github.com/grpc/grpc-rust", rev = "a597b92070dc12d2239923821f86391ad857d910" }

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
extension_api = { workspace = true }
rapira_master = { workspace = true }
rapira_scoreboard = { workspace = true }
rapira_runtime = { workspace = true }
php_sys = { workspace = true }
rapira_config = { workspace = true }
rapira_static_files = { workspace = true }
rapira_http = { workspace = true }
rapira_grpc = { workspace = true }
libc = "0.2"
mimalloc = "0.1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono", "json"] }

[dev-dependencies]
serde_json = "1"
