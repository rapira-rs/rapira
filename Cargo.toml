[workspace.package]
edition = "2024"

[package]
name = "rapira_core"
version = "0.9.2"
edition.workspace = true
description = "PHP application server with HTTP and gRPC worker pools"
homepage = "https://rapira.rs"
documentation = "https://rapira.rs/docs/"
repository = "https://github.com/rapira-rs/rapira"
license = "MIT"
readme = "README.md"

[[bin]]
name = "rapira"
path = "src/main.rs"

[lints]
workspace = true

[workspace]
members = [
    "crates/config",
    "crates/http_middleware",
    "crates/tests",
    "crates/observability",
    "crates/php_build",
    "crates/middleware/compress",
    "crates/middleware/static_files",
    "crates/interceptors/auth",
    "crates/sapi",
    "crates/net",
    "crates/plugins/http",
    "crates/plugins/grpc"
]

[workspace.dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
base64 = "0.23"
tracing = { version = "0.1", default-features = false, features = ["std"] }
rapira_sapi = { path = "crates/sapi" }
rapira_php_build = { path = "crates/php_build" }
rapira_config = { path = "crates/config" }
rapira_http_middleware = { path = "crates/http_middleware" }
rapira_compress = { path = "crates/middleware/compress" }
rapira_static_files = { path = "crates/middleware/static_files" }
rapira_grpc_auth = { path = "crates/interceptors/auth" }
rapira_http = { path = "crates/plugins/http" }
rapira_grpc = { path = "crates/plugins/grpc" }
rapira_net = { path = "crates/net" }
rapira_observability = { path = "crates/observability" }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
tokio = { version = "1", features = ["sync", "io-uring"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
tower = { version = "0.5", features = ["util"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zstd = { version = "0.13", default-features = false }
libc = "0.2"
buffa = { version = "0.9.2", default-features = false, features = ["std"] }
buffa-descriptor = { version = "0.9.2", features = ["reflect", "json"] }
connectrpc = { git = "https://github.com/connectrpc/connect-rust", rev = "bd2ab674786971ca10cc2c23e4808c8d56b6a458", default-features = false, features = ["server", "json", "gzip"] }
connectrpc-health = { git = "https://github.com/connectrpc/connect-rust", rev = "bd2ab674786971ca10cc2c23e4808c8d56b6a458", default-features = false }
connectrpc-reflection = { git = "https://github.com/connectrpc/connect-rust", rev = "bd2ab674786971ca10cc2c23e4808c8d56b6a458", default-features = false }
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
rapira_sapi = { workspace = true }
rapira_config = { workspace = true }
rapira_http = { workspace = true }
rapira_grpc = { workspace = true }
rapira_observability = { workspace = true }
libc = { workspace = true }
mimalloc = "0.1"
serde = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.18", default-features = false, features = ["fmt", "ansi", "env-filter", "json"] }
