name: Lint
on:
    push: { branches: [main] }
    pull_request:
permissions:
    contents: read

jobs:
    fmt:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with: { persist-credentials: false }
            - uses: dtolnay/rust-toolchain@stable
              with: { components: rustfmt }
            - run: cargo fmt --all --check
