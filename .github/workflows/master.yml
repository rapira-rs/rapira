name: CI (php-src master, ZTS debug)
on:
    push: { branches: [main] }
    pull_request:
    workflow_dispatch:
    schedule: [{ cron: "0 6 * * *" }]
permissions:
    contents: read

jobs:
    test:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest]
        env:
            RUST_BACKTRACE: "1"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: ./.github/actions/php-embed
              with: { version: master }
            - name: Verify built extension set
              run: |
                  mods=$(php -m)
                  for ext in bcmath calendar ctype curl dom exif ffi fileinfo filter ftp gettext iconv \
                             igbinary intl mbstring openssl pdo_pgsql pdo_sqlite pgsql phar session \
                             shmop simplexml sockets sodium sqlite3 sysvmsg sysvsem sysvshm tokenizer xml \
                             xmlreader xmlwriter zend_test zlib; do
                      grep -qix "$ext" <<<"$mods" || { echo "missing extension: $ext"; exit 1; }
                  done
            # The x86_64 job links with LLD, the Rust default for that target. https://blog.rust-lang.org/2025/09/01/rust-lld-on-1.90.0-stable/
            - name: Link with LLD on Linux arm64
              if: runner.os == 'Linux' && runner.arch == 'ARM64'
              run: |
                  sudo apt-get install -y --no-install-recommends lld
                  echo "RUSTFLAGS=$RUSTFLAGS -C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with: { cache-on-failure: true }
            - run: cargo test --workspace
            - run: cargo build -p rapira_core --bin rapira && cargo test -p tests --test e2e --features e2e -- --test-threads=1
