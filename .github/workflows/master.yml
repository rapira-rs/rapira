name: CI (php-src master, debug)
on:
    push: { branches: [main] }
    pull_request:
    workflow_dispatch:
    schedule: [{ cron: "0 6 * * *" }]
permissions:
    contents: read

jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        env:
            PHP_PREFIX: ${{ github.workspace }}/.php-master-debug
            RUST_BACKTRACE: "1"
        defaults:
            run:
                working-directory: core
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
              with:
                  path: core
                  persist-credentials: false

            - name: Install build deps (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    build-essential pkg-config curl git autoconf bison re2c \
                    libclang-dev llvm-dev protobuf-compiler \
                    libssl-dev libcurl4-openssl-dev libxml2-dev libonig-dev \
                    libsqlite3-dev zlib1g-dev libffi-dev libicu-dev libpq-dev

            - name: Install build deps (macOS)
              if: runner.os == 'macOS'
              run: |
                  brew install autoconf bison re2c pkg-config openssl@3 curl oniguruma libxml2 sqlite libffi gettext icu4c libpq protobuf
                  echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

            - name: Resolve php-src master commit
              id: phpsrc
              shell: bash
              run: echo "sha=$(git ls-remote https://github.com/php/php-src.git master | cut -f1)" >> "$GITHUB_OUTPUT"

            # restore/save are split so the 15-25 min PHP build is kept even when a later cargo step fails: cache@v4's post-save only runs on job success.
            - name: Restore NTS+debug PHP (embed SAPI)
              id: php
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.PHP_PREFIX }}
                  key: php-master-debug-${{ runner.os }}-${{ runner.arch }}-${{ steps.phpsrc.outputs.sha }}-embed-signals-v9-${{ hashFiles('core/.github/php-configure-flags.txt', 'core/.github/workflows/master.yml') }}

            - name: Build NTS+debug PHP (embed SAPI) from php-src master
              if: steps.php.outputs.cache-hit != 'true'
              run: |
                  set -euo pipefail
                  git clone --depth 1 --branch master https://github.com/php/php-src.git
                  cd php-src
                  EXTRA=""
                  SHA256=(sha256sum)
                  if [ "$RUNNER_OS" = "macOS" ]; then
                    export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix oniguruma)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix libffi)/lib/pkgconfig:$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix libpq)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
                    EXTRA="--with-iconv=$(xcrun --show-sdk-path)/usr --with-gettext=$(brew --prefix gettext)"
                    SHA256=(shasum -a 256)
                  fi
                  curl -fsSL --retry 3 https://codeload.github.com/igbinary/igbinary/tar.gz/2b1f5d62e3037b07c2a46499ac32091cdb41fb40 -o igbinary.tgz
                  curl -fsSL --retry 3 https://codeload.github.com/phpredis/phpredis/tar.gz/753a2d6d6752edf741ad97e885e23320c1be0e96 -o redis.tgz
                  curl -fsSL --retry 3 https://pecl.php.net/get/protobuf-5.36.2.tgz -o protobuf.tgz
                  echo '1664c973d836ae7f0dfa92dbbc04504d506f8caf7c14db27e245646aaaceeab8  igbinary.tgz' | "${SHA256[@]}" -c -
                  echo '258d7b5cfda4e74a24a45d3505a7bc0d15b629fbe66a1e21224b3cc93f768d12  redis.tgz' | "${SHA256[@]}" -c -
                  echo 'f0a17c67de29df0fb0e5215a381df9b155125e1ace6252dd617bf16b4194dd5b  protobuf.tgz' | "${SHA256[@]}" -c -
                  mkdir -p ext/igbinary ext/redis ext/protobuf
                  tar -xzf igbinary.tgz -C ext/igbinary --strip-components=1
                  tar -xzf redis.tgz -C ext/redis --strip-components=1
                  tar -xzf protobuf.tgz -C ext/protobuf --strip-components=1
                  perl -pi -e 's/\bzval_dtor\b/zval_ptr_dtor_nogc/g' ext/protobuf/*.c
                  ./buildconf --force
                  ./configure \
                    --prefix="${PHP_PREFIX}" \
                    --enable-debug-assertions \
                    --enable-zend-test \
                    --enable-debug \
                    --enable-igbinary --enable-redis --enable-redis-igbinary --enable-protobuf \
                    $(tr '\n' ' ' < "$GITHUB_WORKSPACE/core/.github/php-configure-flags.txt") $EXTRA
                  make -j"$(getconf _NPROCESSORS_ONLN)"
                  make install

            - name: Save NTS+debug PHP cache
              if: steps.php.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.PHP_PREFIX }}
                  key: php-master-debug-${{ runner.os }}-${{ runner.arch }}-${{ steps.phpsrc.outputs.sha }}-embed-signals-v9-${{ hashFiles('core/.github/php-configure-flags.txt', 'core/.github/workflows/master.yml') }}

            - name: Expose PHP to build + tests
              run: |
                  echo "${PHP_PREFIX}/bin" >> "$GITHUB_PATH"
                  if [ "$RUNNER_OS" = "macOS" ]; then
                    echo "DYLD_LIBRARY_PATH=${PHP_PREFIX}/lib" >> "$GITHUB_ENV"
                  else
                    echo "LD_LIBRARY_PATH=${PHP_PREFIX}/lib" >> "$GITHUB_ENV"
                  fi

            # Extensions are compiled statically, so `php -m` reflects the embed SAPI too.
            - name: Verify built extension set
              run: |
                  mods=$("${PHP_PREFIX}/bin/php" -m); echo "$mods"
                  for ext in bcmath calendar ctype curl dom exif ffi fileinfo filter ftp gettext iconv \
                             igbinary intl mbstring openssl pdo_pgsql pdo_sqlite pgsql phar protobuf redis session \
                             shmop simplexml sockets sqlite3 sysvmsg sysvsem sysvshm tokenizer xml \
                             xmlreader xmlwriter zlib; do
                    grep -qix "$ext" <<<"$mods" || { echo "missing extension: $ext"; exit 1; }
                  done

            - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  components: clippy
            - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  workspaces: core
                  cache-on-failure: true

            - run: cargo clippy --workspace --all-targets -- -D warnings
            - run: cargo build --workspace
            - run: cargo test --workspace
            - run: cargo build -p rapira_core --bin rapira && cargo test -p tests --test e2e --features e2e -- --test-threads=1
