name: Coverage
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
      # An init as PID 1 reaps the workers that a forced stop leaves as orphans.
      options: --init
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    env:
      RUST_BACKTRACE: "1"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install PHP and build deps
        run: dnf -y install --setopt=install_weak_deps=False git tar gzip xz findutils procps-ng gcc gcc-c++ make clang-devel php-cli php-devel php-embedded php-bcmath php-intl php-mbstring php-pdo php-pgsql php-process php-xml php-pecl-igbinary php-pecl-redis6

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { components: llvm-tools-preview }
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with: { tool: cargo-llvm-cov@0.9.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Generate coverage (lcov)
        env:
          # Fedora 44 has no imap package; the ubuntu-latest CI job covers the imap fixtures.
          RAPIRA_REQUIRE_EXTS: openssl
        run: make coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          version: v11.3.1
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: true
