name: Coverage
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    env:
      RUST_BACKTRACE: "1"
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload (unavailable on fork PRs; see use_oidc below)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none # xdebug and pcov override zend_error_cb and the JIT in the embed SAPI
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, iconv, igbinary, imap, intl, mbstring, opcache, openssl, pdo_pgsql, pdo_sqlite, pgsql, phar, posix, redis, session, simplexml, sqlite3, tokenizer, xml, xmlreader, xmlwriter, zlib
        env:
          phpts: nts
          fail-fast: true # a missing extension fails the job instead of warning

      - name: Build deps for bindgen/cc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libclang-dev

      - uses: dtolnay/rust-toolchain@c6590455eca8e79d081430ebfe2074192ae90290 # 1.98.1
        with: { components: llvm-tools-preview }
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with: { tool: cargo-llvm-cov@0.9.1 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Generate coverage (lcov)
        # a skip in a gated suite on Linux means a broken install, not a pass
        env:
          RAPIRA_REQUIRE_EXTS: imap,openssl
        run: make coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          version: v11.3.1
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: true
