name: Release
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-please
    cancel-in-progress: false

jobs:
    release-please:
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: write
            pull-requests: write
            issues: write
        outputs:
            release_created: ${{ steps.rp.outputs.release_created }}
            tag_name: ${{ steps.rp.outputs.tag_name }}
            version: ${{ steps.rp.outputs.version }}
        steps:
            - id: rp
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

    binaries:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        permissions:
            contents: write
        uses: ./.github/workflows/build-binaries.yml
        with:
            ref: ${{ needs.release-please.outputs.tag_name }}
            version: ${{ needs.release-please.outputs.version }}
            upload_to: ${{ needs.release-please.outputs.tag_name }}

    images:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/docker.yml
        with:
            ref: ${{ needs.release-please.outputs.tag_name }}
            version: ${{ needs.release-please.outputs.version }}

    publish:
        needs: [release-please, binaries, images]
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            TAG: ${{ needs.release-please.outputs.tag_name }}
            V: ${{ needs.release-please.outputs.version }}
        steps:
            - shell: bash
              run: |
                  set -euo pipefail
                  case "$V" in
                    *-*) gh release edit "$TAG" --draft=false --prerelease ;;
                    *) gh release edit "$TAG" --draft=false --latest ;;
                  esac

    aliases:
        needs: [release-please, images, publish]
        if: ${{ !contains(needs.release-please.outputs.version, '-') }}
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/docker-aliases.yml
        with:
            tag: ${{ needs.release-please.outputs.tag_name }}
            php: ${{ needs.images.outputs.php }}
