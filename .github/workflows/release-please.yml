name: Release
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-please
    cancel-in-progress: false

jobs:
    release-please:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            pull-requests: write
            issues: write
        outputs:
            release_created: ${{ steps.rp.outputs.release_created }}
            tag_name: ${{ steps.rp.outputs.tag_name }}
            version: ${{ steps.rp.outputs.version }}
        steps:
            - id: rp
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

    binaries:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        permissions:
            contents: write
        uses: ./.github/workflows/build-binaries.yml
        with:
            ref: ${{ needs.release-please.outputs.tag_name }}
            version: ${{ needs.release-please.outputs.version }}
            upload_to: ${{ needs.release-please.outputs.tag_name }}

    images:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/docker.yml
        with:
            ref: ${{ needs.release-please.outputs.tag_name }}
            version: ${{ needs.release-please.outputs.version }}

    publish:
        needs: [release-please, binaries, images]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            packages: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            TAG: ${{ needs.release-please.outputs.tag_name }}
            IMAGE: ghcr.io/${{ github.repository }}
            V: ${{ needs.release-please.outputs.version }}
        steps:
            - shell: bash
              run: |
                  set -euo pipefail
                  case "$V" in
                    *-*) gh release edit "$TAG" --draft=false --prerelease ;;
                    *) gh release edit "$TAG" --draft=false --latest ;;
                  esac
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Move the php minor aliases
              shell: bash
              run: |
                  set -euo pipefail
                  case "$V" in *-*) exit 0 ;; esac
                  for PHP in 8.4 8.5; do
                      docker buildx imagetools create \
                        -t "$IMAGE:${V%.*}-php$PHP" -t "$IMAGE:php$PHP" \
                        "$IMAGE:$V-php$PHP"
                  done
