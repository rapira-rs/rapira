# php-rebuild.yml on main calls this file to build the newest release again.
# So this file must always work with the dockerfiles directory of the newest release.
name: Docker
on:
    workflow_call:
        inputs:
            ref:
                description: "Tag or commit to build"
                type: string
                required: true
            version:
                description: "Image version tag, without the v prefix"
                type: string
                required: true
            alias:
                description: "Extra moving alias prefix for the merged tags, such as nightly"
                type: string
                default: ""
            php:
                description: "PHP minors to build, separated by spaces"
                type: string
                default: "8.4 8.5 8.6"
            no_cache:
                description: "Build without the layer cache"
                type: boolean
                default: false
    workflow_dispatch:
        inputs:
            ref:
                description: "Tag or commit to build"
                type: string
                default: main
            version:
                description: "Image version tag, without the v prefix"
                type: string
                required: true
            php:
                description: "PHP minors to build, separated by spaces"
                type: string
                default: "8.4 8.5 8.6"

permissions:
    contents: read

env:
    IMAGE: ghcr.io/${{ github.repository }}

jobs:
    resolve:
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        outputs:
            matrix: ${{ steps.tags.outputs.matrix }}
        steps:
            - id: tags
              shell: bash
              env:
                  MINORS: ${{ inputs.php }}
              run: |
                  set -euo pipefail
                  for MINOR in $MINORS; do
                      # The newest stable php-src tag of the minor.
                      VERSION=$(git ls-remote --tags --refs https://github.com/php/php-src.git "refs/tags/php-$MINOR.*" \
                          | sed -n -E 's|.*refs/tags/php-([0-9]+\.[0-9]+\.[0-9]+)$|\1|p' | sort -V | tail -n 1)
                      [ -n "$VERSION" ] || { echo "::error::no stable php-src tag for PHP $MINOR"; exit 1; }
                      jq -cn --arg php "$MINOR" --arg version "$VERSION" '{php: $php, version: $version}' >> images.json
                  done
                  cat images.json
                  echo "matrix=$(jq -cs . images.json)" >> "$GITHUB_OUTPUT"

    build:
        needs: resolve
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                image: ${{ fromJSON(needs.resolve.outputs.matrix) }}
                variant: [nts, zts]
                arch: [amd64, arm64]
                include:
                    - { arch: amd64, runner: ubuntu-26.04 }
                    - { arch: arm64, runner: ubuntu-26.04-arm }
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.ref }}
                  persist-credentials: false
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: dockerfiles/${{ matrix.image.php }}/${{ matrix.variant }}/Dockerfile
                  build-args: PHP_VERSION=${{ matrix.image.version }}
                  no-cache: ${{ inputs.no_cache || false }}
                  push: true
                  tags: ${{ env.IMAGE }}:${{ inputs.version }}-php${{ matrix.image.php }}-${{ matrix.variant }}-${{ matrix.arch }}
                  cache-from: type=gha,scope=${{ matrix.image.php }}-${{ matrix.variant }}-${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image.php }}-${{ matrix.variant }}-${{ matrix.arch }}

    merge:
        needs: [resolve, build]
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                image: ${{ fromJSON(needs.resolve.outputs.matrix) }}
                variant: [nts, zts]
        steps:
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - shell: bash
              env:
                  NAME: php${{ matrix.image.php }}-${{ matrix.variant }}
                  PHP_VERSION: ${{ matrix.image.version }}
                  V: ${{ inputs.version }}
                  ALIAS: ${{ inputs.alias }}
              run: |
                  set -euo pipefail
                  TAGS=(-t "$IMAGE:$V-$NAME")
                  [ -z "$ALIAS" ] || TAGS+=(-t "$IMAGE:$ALIAS-$NAME")
                  # php-rebuild.yml reads the two annotations.
                  docker buildx imagetools create "${TAGS[@]}" \
                    --annotation "index:rs.rapira.php.version=$PHP_VERSION" \
                    --annotation "index:org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    "$IMAGE:$V-$NAME-amd64" "$IMAGE:$V-$NAME-arm64"
