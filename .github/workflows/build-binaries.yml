name: Build binaries
# Reusable build for the stable release path (release-please.yml) and the nightly
# path (nightly.yml). The jobs run inside the caller's run, under the caller's
# concurrency group. A callee group that matches it is cancelled as a deadlock.
on:
    workflow_call:
        inputs:
            ref:
                description: "Tag or commit to build"
                type: string
                required: true
            version:
                description: "Version stem for the asset names, such as 0.8.0 or 0.7.0-nightly.abc1234"
                type: string
                required: true
            packages:
                description: "Build and validate the deb and rpm packages"
                type: boolean
                default: true
            upload_to:
                description: "Release tag that gets the assets. Empty keeps them as run artifacts."
                type: string
                default: ""
            rolling:
                description: "Move the upload_to tag to the built commit and drop assets of older builds. The caller passes a commit sha as ref."
                type: boolean
                default: false
    workflow_dispatch:
        inputs:
            ref:
                description: "Tag or commit to build"
                type: string
                default: main
            version:
                description: "Version stem for the asset names, such as 0.8.0"
                type: string
                required: true
            packages:
                description: "Build and validate the deb and rpm packages"
                type: boolean
                default: true
            upload_to:
                description: "Release tag that gets the assets. Empty keeps them as run artifacts."
                type: string
                default: ""
            php_84:
                description: "Override PHP 8.4 patch version (blank = latest)"
                type: string
                default: ""
            php_85:
                description: "Override PHP 8.5 patch version (blank = latest)"
                type: string
                default: ""

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    # One resolve per run: the legs must not split across a php.net patch release
    # that lands while the matrix runs.
    prepare:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            php_84: ${{ steps.php.outputs.php_84 }}
            php_85: ${{ steps.php.outputs.php_85 }}
        steps:
            - id: php
              shell: bash
              env:
                  PHP_84_OVERRIDE: ${{ inputs.php_84 }}
                  PHP_85_OVERRIDE: ${{ inputs.php_85 }}
              run: |
                  set -euo pipefail
                  resolve() {
                      local branch="$1" override="$2"
                      if [ -n "$override" ]; then
                          if [[ ! "$override" =~ ^8\.[45]\.[0-9]+$ ]] || [ "${override%.*}" != "$branch" ]; then
                              echo "::error::invalid PHP override '$override' for branch $branch" >&2; exit 1
                          fi
                          echo "$override"
                      else
                          curl -fsSL "https://www.php.net/releases/index.php?json&version=$branch" \
                            | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"])'
                      fi
                  }
                  PHP_84=$(resolve 8.4 "$PHP_84_OVERRIDE")
                  PHP_85=$(resolve 8.5 "$PHP_85_OVERRIDE")
                  echo "php_84=$PHP_84" >> "$GITHUB_OUTPUT"
                  echo "php_85=$PHP_85" >> "$GITHUB_OUTPUT"
                  echo "PHP $PHP_84 / $PHP_85"

    build:
        needs: prepare
        runs-on: ${{ matrix.runner }}
        # A caller job cannot carry a timeout for a reusable workflow. Without one
        # here a wedged leg holds the release-please concurrency group for the
        # 360-minute default and strands the release as a draft.
        timeout-minutes: 90
        # Linux legs build inside rockylinux:9 (glibc 2.34, OpenSSL 3.0) so the artifacts serve RHEL 9 as well as Ubuntu 22.04+/Debian 12, pinned to the multi-arch manifest-list digest; non-Linux legs leave `container` unset (empty expression = no container).
        container: ${{ matrix.container }}
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {
                          name: linux-x86_64-php8.4,
                          runner: ubuntu-latest,
                          container: "rockylinux:9@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6",
                          target_os: linux,
                          arch: x86_64,
                          nfpm_arch: amd64,
                          php_branch: "8.4",
                      }
                    - {
                          name: linux-x86_64-php8.5,
                          runner: ubuntu-latest,
                          container: "rockylinux:9@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6",
                          target_os: linux,
                          arch: x86_64,
                          nfpm_arch: amd64,
                          php_branch: "8.5",
                      }
                    - {
                          name: linux-aarch64-php8.4,
                          runner: ubuntu-24.04-arm,
                          container: "rockylinux:9@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6",
                          target_os: linux,
                          arch: aarch64,
                          nfpm_arch: arm64,
                          php_branch: "8.4",
                      }
                    - {
                          name: linux-aarch64-php8.5,
                          runner: ubuntu-24.04-arm,
                          container: "rockylinux:9@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6",
                          target_os: linux,
                          arch: aarch64,
                          nfpm_arch: arm64,
                          php_branch: "8.5",
                      }
                    - {
                          name: macos-aarch64-php8.4,
                          runner: macos-14,
                          target_os: macos,
                          arch: aarch64,
                          php_branch: "8.4",
                      }
                    - {
                          name: macos-aarch64-php8.5,
                          runner: macos-14,
                          target_os: macos,
                          arch: aarch64,
                          php_branch: "8.5",
                      }
        env:
            PHP_PREFIX: ${{ github.workspace }}/.php-embed
            VERSION: ${{ inputs.version }}
            STEM: rapira-v${{ inputs.version }}-php${{ matrix.php_branch }}-${{ matrix.target_os }}-${{ matrix.arch }}
            PHP_FULL: ${{ matrix.php_branch == '8.4' && needs.prepare.outputs.php_84 || needs.prepare.outputs.php_85 }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.ref }}
                  persist-credentials: false

            # oniguruma-devel only exists in the CRB repo.
            - name: Install build deps (Linux container)
              if: runner.os == 'Linux'
              run: |
                  dnf -y install dnf-plugins-core
                  dnf config-manager --set-enabled crb
                  dnf -y install epel-release
                  dnf -y install \
                    gcc gcc-c++ make git tar gzip xz findutils autoconf patchelf \
                    pkgconf-pkg-config clang-devel llvm-devel \
                    openssl-devel libcurl-devel libxml2-devel oniguruma-devel zlib-devel sqlite-devel libffi-devel gettext-devel libicu-devel libpq-devel

            - name: Install build deps (macOS)
              if: runner.os == 'macOS'
              run: brew install autoconf pkg-config openssl@3 curl oniguruma libxml2 sqlite libffi gettext icu4c libpq

            # Split restore/save (as master.yml): the PHP build survives later failures.
            - name: Restore PHP embed runtime
              id: phpcache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.PHP_PREFIX }}
                  key: php-embed-rel-${{ runner.os }}-${{ runner.arch }}-${{ env.PHP_FULL }}-${{ hashFiles('.github/php-configure-flags.txt', '.github/workflows/build-binaries.yml') }}-v2

            - name: Build PHP embed from release tarball (Unix)
              if: steps.phpcache.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  curl -fsSL "https://www.php.net/distributions/php-${PHP_FULL}.tar.gz" -o php.tar.gz
                  tar xf php.tar.gz && cd "php-${PHP_FULL}"
                  export CFLAGS="-O2"
                  EXTRA=""
                  SHA256=(sha256sum)
                  if [ "$RUNNER_OS" = "macOS" ]; then
                    export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix oniguruma)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix libffi)/lib/pkgconfig:$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix libpq)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
                    EXTRA="--with-iconv=$(xcrun --show-sdk-path)/usr --with-gettext=$(brew --prefix gettext)"
                    SHA256=(shasum -a 256)
                  fi
                  curl -fsSL --retry 3 https://pecl.php.net/get/igbinary-3.2.17RC1.tgz -o igbinary.tgz
                  curl -fsSL --retry 3 https://pecl.php.net/get/redis-6.3.0.tgz -o redis.tgz
                  echo '91da821443db125282a6aea039f24588dd28ff5d71e8187f6ecc41165bceafbc  igbinary.tgz' | "${SHA256[@]}" -c -
                  echo '0d5141f634bd1db6c1ddcda053d25ecf2c4fc1c395430d534fd3f8d51dd7f0b5  redis.tgz' | "${SHA256[@]}" -c -
                  mkdir -p ext/igbinary ext/redis
                  tar -xzf igbinary.tgz -C ext/igbinary --strip-components=1
                  tar -xzf redis.tgz -C ext/redis --strip-components=1
                  ./buildconf --force
                  ./configure --prefix="$PHP_PREFIX" $(tr '\n' ' ' < "$GITHUB_WORKSPACE/.github/php-configure-flags.txt") \
                    --enable-igbinary --enable-redis --enable-redis-igbinary $EXTRA
                  make -j"$(getconf _NPROCESSORS_ONLN)"
                  make install

            - name: Save PHP embed runtime
              if: steps.phpcache.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.PHP_PREFIX }}
                  key: php-embed-rel-${{ runner.os }}-${{ runner.arch }}-${{ env.PHP_FULL }}-${{ hashFiles('.github/php-configure-flags.txt', '.github/workflows/build-binaries.yml') }}-v2

            - name: Expose PHP + rpath (Linux)
              if: runner.os == 'Linux'
              run: |
                  echo "PHP_CONFIG=$PHP_PREFIX/bin/php-config" >> "$GITHUB_ENV"
                  echo "$PHP_PREFIX/bin" >> "$GITHUB_PATH"
                  echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,$ORIGIN/../lib/rapira -L native='"$PHP_PREFIX/lib" >> "$GITHUB_ENV"

            - name: Expose PHP + rpath (macOS)
              if: runner.os == 'macOS'
              run: |
                  echo "PHP_CONFIG=$PHP_PREFIX/bin/php-config" >> "$GITHUB_ENV"
                  echo "$PHP_PREFIX/bin" >> "$GITHUB_PATH"
                  echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
                  echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,@loader_path/../lib/rapira -L native=$PHP_PREFIX/lib" >> "$GITHUB_ENV"

            - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
            - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with: { cache-on-failure: true }

            - name: Build rapira
              run: cargo build --release --locked --bin rapira

            - name: Assemble layout
              shell: bash
              run: |
                  set -euo pipefail
                  ROOT="dist/$STEM"; mkdir -p "$ROOT/bin" "$ROOT/lib/rapira" "$ROOT/share/php"
                  cp target/release/rapira "$ROOT/bin/rapira"
                  cp README.md LICENSE "$ROOT/"
                  echo "$PHP_FULL" > "$ROOT/share/php/PHP_VERSION.txt"
                  if [ "${PHP_FULL%.*}" = "8.4" ]; then
                    EXT_DIR=$("$PHP_PREFIX/bin/php-config" --extension-dir)
                    cp "$EXT_DIR/opcache.so" "$ROOT/lib/rapira/"
                  fi
                  if [ "$RUNNER_OS" = "Linux" ]; then
                    LP=$(find "$PHP_PREFIX" -name 'libphp*.so' | head -1)
                    cp "$LP" "$ROOT/lib/rapira/libphp.so"
                    # ICU uses versioned library names: https://unicode-org.github.io/icu/userguide/icu4c/packaging.html#posix-library-names
                    mapfile -t ICU_LIBS < <(ldd "$LP" | awk '$1 ~ /^libicu/ {print $3}')
                    test "${#ICU_LIBS[@]}" -gt 0
                    for lib in "${ICU_LIBS[@]}"; do
                      cp "$lib" "$ROOT/lib/rapira/"
                    done
                    for lib in "$ROOT/lib/rapira/"*.so*; do
                      patchelf --set-rpath "\$ORIGIN" "$lib"
                    done
                  else
                    BIN="$ROOT/bin/rapira"; LIB="$ROOT/lib/rapira"
                    cp "$PHP_PREFIX/lib/libphp.dylib" "$LIB/"
                    # $1 is the file to fix. $2 is the directory that its @rpath and @loader_path dependencies resolve against.
                    # Homebrew libraries load siblings through @loader_path, for example libbrotlidec and libicuuc.
                    bundle() {
                      otool -L "$1" | awk 'NR>1{print $1}' | while read -r dep; do
                        case "$dep" in
                          /usr/lib/*|/System/*) continue;;
                          @rpath/*|@loader_path/*) src="$2/${dep#@*/}";;
                          @*) continue;;
                          *) src="$dep";;
                        esac
                        base=$(basename "$dep")
                        if [ ! -f "$LIB/$base" ]; then
                          cp "$src" "$LIB/$base"; chmod u+w "$LIB/$base"
                          install_name_tool -id "@rpath/$base" "$LIB/$base"
                          bundle "$LIB/$base" "$(dirname "$src")"
                        fi
                        install_name_tool -change "$dep" "@rpath/$base" "$1"
                      done
                    }
                    install_name_tool -id @rpath/libphp.dylib "$LIB/libphp.dylib"
                    for f in "$LIB"/*; do bundle "$f" "$PHP_PREFIX/lib"; done
                    bundle "$BIN" "$PHP_PREFIX/lib"
                    codesign --force -s - "$LIB"/*
                    codesign --force -s - "$BIN"
                    codesign -v "$BIN"
                    "$BIN" --version
                  fi

            - name: Archive
              shell: bash
              run: |
                  set -euo pipefail
                  cd dist
                  tar czf "$STEM.tar.gz" "$STEM"

            - name: Stage pkgroot for nFPM (Linux)
              if: runner.os == 'Linux' && inputs.packages
              shell: bash
              run: |
                  set -euo pipefail
                  PR="dist/pkgroot-${{ matrix.nfpm_arch }}-php${{ matrix.php_branch }}"
                  mkdir -p "$PR/usr/bin" "$PR/usr/lib/rapira"
                  cp "dist/$STEM/bin/rapira"           "$PR/usr/bin/rapira"
                  cp "dist/$STEM/lib/rapira/"*.so*     "$PR/usr/lib/rapira/"

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: art-${{ matrix.name }}
                  path: |
                      dist/*.tar.gz
                      dist/pkgroot-*
                  if-no-files-found: error
                  retention-days: 7

    package:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
        env:
            VERSION: ${{ inputs.version }}
            TAG: ${{ inputs.upload_to }}
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            NFPM_VERSION: "2.47.0"
            NFPM_SHA256: "3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97"
        steps:
            # Only nfpm reads the working tree here.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              if: inputs.packages
              with:
                  ref: ${{ inputs.ref }}
                  persist-credentials: false
            # The pattern scopes the download to this workflow's build artifacts: a
            # called workflow shares the caller's run artifact namespace.
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with: { path: incoming, pattern: "art-*", merge-multiple: true }

            - name: Collect tarballs
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p dist
                  cp incoming/*.tar.gz dist/

            - name: Build deb/rpm
              if: inputs.packages
              shell: bash
              run: |
                  set -euo pipefail
                  cp -r incoming/pkgroot-* dist/
                  curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" -o /tmp/nfpm.deb
                  echo "${NFPM_SHA256}  /tmp/nfpm.deb" | sha256sum -c -
                  sudo dpkg -i /tmp/nfpm.deb
                  for arch in amd64 arm64; do
                    for minor in 8.4 8.5; do
                      test -d "dist/pkgroot-${arch}-php${minor}" || { echo "::error::missing pkgroot ${arch}/php${minor}"; exit 1; }
                      # nfpm does not env-expand contents.src - stage each variant at the fixed path
                      rm -rf dist/pkgroot-current
                      cp -r "dist/pkgroot-${arch}-php${minor}" dist/pkgroot-current
                      NFPM_ARCH=$arch PHP_MINOR=$minor VERSION="$VERSION" nfpm pkg -p deb -f nfpm.yaml -t dist/
                      NFPM_ARCH=$arch PHP_MINOR=$minor VERSION="$VERSION" nfpm pkg -p rpm -f nfpm.yaml -t dist/
                    done
                  done
                  rm -rf dist/pkgroot-*

            - name: Checksums
              shell: bash
              run: |
                  set -euo pipefail
                  ( cd dist && sha256sum rapira-* > "rapira-v${VERSION}-SHA256SUMS.txt" )
                  ls -l dist

            # Installing every amd64 package in a real container catches wrong dependency names and broken RUNPATH before anything is published; arm64 is skipped (no qemu).
            - name: Validate packages (amd64)
              if: inputs.packages
              shell: bash
              run: |
                  set -euo pipefail
                  for deb in dist/*_amd64.deb; do
                    docker run --rm -v "$PWD/dist:/dist:ro" debian:12 \
                      bash -ec "apt-get update -q && apt-get install -yq /dist/$(basename "$deb") && rapira --help"
                  done
                  for rpm in dist/*.x86_64.rpm; do
                    docker run --rm -v "$PWD/dist:/dist:ro" rockylinux:9 \
                      bash -ec "dnf install -yq /dist/$(basename "$rpm") && rapira --help"
                  done

            # A dry run keeps the deb/rpm and checksums as run artifacts.
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: inputs.upload_to == ''
              with:
                  name: dist
                  path: dist/*
                  if-no-files-found: error
                  retention-days: 7

            - name: Prepare the rolling release
              if: inputs.rolling
              shell: bash
              env:
                  SHA: ${{ inputs.ref }}
              run: |
                  set -euo pipefail
                  gh release view "$TAG" >/dev/null \
                    || gh release create "$TAG" --prerelease --target "$SHA" --title "$TAG" --notes "Rolling build."

            - name: Upload assets
              if: inputs.upload_to != ''
              shell: bash
              run: gh release upload "$TAG" dist/* --clobber

            # Runs after the upload: an existing rolling tag never moves ahead of its
            # assets. The first run's release create is the one case where the tag
            # exists before them.
            - name: Move the rolling tag and drop old assets
              if: inputs.rolling
              shell: bash
              env:
                  SHA: ${{ inputs.ref }}
              run: |
                  set -euo pipefail
                  # gh release edit --target does not move an existing tag, the ref has to be forced.
                  # https://docs.github.com/en/rest/git/refs#update-a-reference
                  if ! gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$SHA" -F force=true >/dev/null; then
                      gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
                  fi
                  gh release edit "$TAG" --prerelease --notes "Rolling build. Version $VERSION. Commit $SHA."
                  # A caller that combines rolling with packages puts nfpm names on the
                  # rolling release. nfpm and the upload rewrite the prerelease separator
                  # (0.7.0-x, 0.7.0~x, 0.7.0.x), so names are compared as substrings
                  # with every separator stripped.
                  KEEP=$(tr -cd '[:alnum:]' <<< "$VERSION")
                  ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
                  # self-check: this run's uploads must pass the keep filter, otherwise the
                  # filter no longer matches the upload names and the prune would drop them
                  tr -cd '[:alnum:]\n' <<< "$ASSETS" | grep -qF "$KEEP" \
                    || { echo "::error::no asset matches $KEEP - the prune filter does not match the upload names"; exit 1; }
                  while read -r name; do
                      case "$(tr -cd '[:alnum:]' <<< "$name")" in *"$KEEP"*) continue ;; esac
                      gh release delete-asset "$TAG" "$name" --yes
                  done <<< "$ASSETS"
