name: CI
on:
    push: { branches: [main] }
    pull_request:
permissions:
    contents: read

jobs:
    fmt:
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with: { components: rustfmt }
            - run: cargo fmt --all --check

    test:
        name: ${{ matrix.os }} PHP ${{ matrix.php }} ${{ matrix.model }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest]
                php: ["8.4", "8.5", "8.6"]
                model: [zts]
                include:
                    - { os: ubuntu-26.04, php: "8.5", model: nts }
        env:
            RUST_BACKTRACE: "1"
            DDTRACE_VERSION: "2.0.0"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }

            - uses: ./.github/actions/php-embed
              with:
                  version: ${{ matrix.php }}
                  model: ${{ matrix.model }}

            - name: Install the Datadog ZTS tracer
              if: runner.os == 'Linux' && matrix.model == 'zts'
              run: |
                  set -euo pipefail
                  arch=$(uname -m)
                  api=$(php -i | awk '/^PHP Extension =>/{print $NF}')
                  case "$arch-$api" in
                      x86_64-20240924)  sha=10a78af9713135480a05c5de0b483eac76eef49f63e5fbc335896e9fca421a8c ;;
                      x86_64-20250925)  sha=b3c0bec26334edd9066ae2aa8271b55457bbfa258ca201b8366299562e1f4caf ;;
                      x86_64-20261112)  sha=d86b70b687a32cd25a886e66e11e215461652cc78e93ffea44a33d36e461e485 ;;
                      aarch64-20240924) sha=fe8d8592ebd2ae20f9d7fbbdf855e73ee34f5a68e79d5a4ae58a0bb862a7778b ;;
                      aarch64-20250925) sha=19aa88e98690c3aad03bc1dd76ff9bb42bf05dfda0ea9173489ff6a606e360be ;;
                      aarch64-20261112) sha=e982b931e51755d4e20e1db817a53189e433aa507747100ef2eff17efb68e53a ;;
                      *) echo "::error::no ddtrace checksum for $arch-$api"; exit 1 ;;
                  esac
                  cd "$RUNNER_TEMP"
                  curl -fsSL --retry 3 "https://github.com/DataDog/dd-trace-php/releases/download/$DDTRACE_VERSION/dd-library-php-$DDTRACE_VERSION-$arch-linux-gnu-$api-zts.tar.gz" -o ddtrace.tgz
                  echo "$sha  ddtrace.tgz" | sha256sum -c -
                  tar xzf ddtrace.tgz --wildcards "*/trace/ext/$api/ddtrace-zts.so"
                  install -D -m 0644 "dd-library-php/trace/ext/$api/ddtrace-zts.so" "$(php-config --extension-dir)/ddtrace.so"
                  DD_TRACE_ENABLED=0 DD_INSTRUMENTATION_TELEMETRY_ENABLED=0 php -d extension=ddtrace.so -r 'exit(extension_loaded("ddtrace") ? 0 : 1);'

            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with: { components: clippy }
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  key: ${{ matrix.php }}-${{ matrix.model }}
                  cache-on-failure: true
            - run: cargo clippy --workspace --all-targets -- -D warnings
            - run: cargo clippy -p tests --features e2e --tests -- -D warnings
            - run: cargo test --workspace
            - if: runner.os != 'Linux' || runner.arch != 'X64'
              run: cargo build -p rapira_core --bin rapira && cargo test -p tests --test e2e --features e2e -- --test-threads=1
            - if: runner.os == 'Linux' && runner.arch == 'X64'
              run: cargo build --release -p rapira_core --bin rapira && cargo test -p tests --test e2e --features e2e -- --test-threads=1
              env:
                  RAPIRA_BIN: ${{ github.workspace }}/target/release/rapira
