name: Fuzz
on:
    schedule:
        - cron: "17 3 * * 1,4"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    fuzz:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        # The image ships libphp.so and the PHP headers. The digest is the PHP 8.5 base of docker.yml.
        container: "php:8.5-cli-trixie@sha256:54d82ff9be6bd198145e90c917fc9b2e24230b42e52def8deb3554baf61c451a"
        steps:
            # actions/checkout needs git in the container.
            - name: Install build deps
              run: |
                  apt-get update
                  apt-get install -y --no-install-recommends clang libclang-dev git make

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }

            - name: Install nightly Rust and cargo-fuzz
              run: |
                  curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain nightly
                  "$HOME/.cargo/bin/cargo" +nightly install --locked cargo-fuzz@0.13.2
                  echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

            # Each run saves the corpus under a new key and restores the newest one by prefix. Two runs a week keep the entry inside the 7-day cache eviction window.
            - name: Restore the corpus
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: fuzz/corpus
                  key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: fuzz-corpus-

            - run: make fuzz

            - name: Save the corpus
              if: always()
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: fuzz/corpus
                  key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}

            - name: Upload the crash inputs
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: fuzz-artifacts
                  path: fuzz/artifacts
                  if-no-files-found: ignore
