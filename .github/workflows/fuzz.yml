name: Fuzz
on:
    schedule:
        - cron: "17 3 * * 1,4"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    fuzz:
        # Schemathesis runs in Docker with the host network, so the job runs directly on the runner host.
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            RUST_BACKTRACE: "1"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: "8.5"
                  coverage: none
              env:
                  phpts: nts

            - name: Build deps for bindgen/cc
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libclang-dev

            - name: Expose the PHP embed lib
              run: |
                  LIBPHP=/usr/lib/libphp8.5.so
                  test -e "$LIBPHP" || { echo "missing $LIBPHP"; exit 1; }
                  mkdir -p "$RUNNER_TEMP/phplib"
                  ln -sf "$LIBPHP" "$RUNNER_TEMP/phplib/libphp.so"
                  echo "LD_LIBRARY_PATH=$RUNNER_TEMP/phplib:/usr/lib" >> "$GITHUB_ENV"
                  echo "RUSTFLAGS=-L native=$RUNNER_TEMP/phplib" >> "$GITHUB_ENV"

            - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
            - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  cache-on-failure: true

            - run: cargo build -p rapira_core --bin rapira && cargo test -p tests --test e2e --features e2e -- --ignored generated_requests_cross_the_http_listener_long --test-threads=1
