name: Fuzz
on:
    pull_request:
    schedule:
        - cron: "17 3 * * 1,4"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    fuzz:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            # The rapira image of crates/tests/tests/fuzz/compose.yaml. The GitHub Actions cache keeps its layers between runs.
            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  target: payload
                  load: true
                  tags: rapira-fuzz
                  # docker.yml keeps the same stages from main in the scope 8.5-amd64.
                  cache-from: |
                      type=gha,scope=fuzz
                      type=gha,scope=8.5-amd64
                  cache-to: type=gha,mode=max,scope=fuzz

            # A pull request runs a short session with a fixed seed. A scheduled or manual run uses the run id as a new seed.
            - name: Fuzz session
              env:
                  SEED: ${{ github.event_name == 'pull_request' && '1' || github.run_id }}
                  EXAMPLES: ${{ github.event_name == 'pull_request' && '500' || '2000' }}
              run: docker compose -f crates/tests/tests/fuzz/compose.yaml up --no-build --exit-code-from fuzz
