# A fuzz session: docker compose -f .github/fuzz/compose.yaml up --build --exit-code-from fuzz
# SEED (default 1) and EXAMPLES (default 500) select the session. The same values replay it.
services:
  rapira:
    image: rapira-fuzz
    # The payload stage holds the release build of rapira in /out and the PHP runtime that it links.
    build:
      context: ../..
      target: payload
    command: [/out/usr/local/bin/rapira, serve, /fuzz/rapira.toml]
    volumes:
      - .:/fuzz:ro
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9180/readyz]
      interval: 1s
      retries: 60

  fuzz:
    # Schemathesis 4.29.0. Dependabot does not track this image: bump the digest by hand.
    image: schemathesis/schemathesis@sha256:5586e94460479271714d47613175b3620c44b38b3e1babc936636108f1672a9e
    depends_on:
      rapira:
        condition: service_healthy
    entrypoint: [sh, /fuzz/run.sh]
    environment:
      SEED: ${SEED:-1}
      EXAMPLES: ${EXAMPLES:-500}
      # The image runs a free-threaded CPython. With the GIL off, its Schemathesis process segfaulted in about 1 of 300 sessions.
      PYTHON_GIL: "1"
    volumes:
      - .:/fuzz:ro
