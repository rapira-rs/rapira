// From .github/fuzz/grpc: go run github.com/bufbuild/buf/cmd/buf@v1.73.0 build . --as-file-descriptor-set -o sample.binpb
// One field of each kind for the Connect JSON fuzz target, with no well-known types.
syntax = "proto3";

package rapira.test.fuzz.v1;

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_ONE = 1;
  KIND_TWO = 2;
  KIND_NEGATIVE = -1;
}

message Inner {
  int32 id = 1;
  string label = 2;
}

message Sample {
  int32 int32_value = 1;
  int64 int64_value = 2;
  uint32 uint32_value = 3;
  uint64 uint64_value = 4;
  sint32 sint32_value = 5;
  sint64 sint64_value = 6;
  fixed32 fixed32_value = 7;
  fixed64 fixed64_value = 8;
  sfixed32 sfixed32_value = 9;
  sfixed64 sfixed64_value = 10;
  float float_value = 11;
  double double_value = 12;
  bool bool_value = 13;
  string string_value = 14;
  bytes bytes_value = 15;
  Kind kind = 16;
  Inner inner = 17;
  repeated int32 repeated_int32 = 18;
  repeated string repeated_string = 19;
  repeated Kind repeated_kind = 20;
  repeated Inner repeated_inner = 21;
  map<string, int64> string_to_int64 = 22;
  map<int32, string> int32_to_string = 23;
  oneof choice {
    string choice_text = 24;
    Inner choice_inner = 25;
    int64 choice_number = 26;
  }
  optional int32 optional_int32 = 27;
}

service FuzzService {
  rpc Echo(Sample) returns (Sample);
}
