version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /crates/tests/tests/fuzz
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    # The rust image follows rust-toolchain.toml, which stays on 1.98.1 until a stable release fixes https://github.com/rust-lang/rust/issues/163911
    ignore:
      - dependency-name: rust
        versions: [">= 1.99"]
