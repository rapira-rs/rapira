version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /crates/tests/tests/fuzz
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    # Each php base stays on its PHP minor. Digest updates of the current tag continue.
    ignore:
      - dependency-name: php
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
