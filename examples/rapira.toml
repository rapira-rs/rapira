# Example rapira.toml. Every key except http.pool.entrypoint is optional.
# Commented keys show defaults or example values. Run it with: rapira serve examples/rapira.toml

[http]
listen = "127.0.0.1:8000"    # host:port, ":port" for all interfaces, or "unix:/path"
# server_name = "localhost"
# server_port = 8000         # what PHP sees as SERVER_PORT; defaults to the listen port
# max_body_size_mb = 8       # larger request bodies answer 413
# write_timeout_secs = 30    # closes the connection when a response write stalls this long
# keepalive_timeout_secs = 60 # closes a keepalive connection idle past the limit; also caps one head or body-frame read
# middleware = ["static"]    # applied in list order; each configured middleware must be listed

# Multipart limits of the http plugin, for dispatcher mode only. Classic and worker modes parse
# in PHP, where php.ini sets the limits. With an explicit table under another mode, the boot fails.
# [http.uploads]
# dir = "/tmp"               # spool root for file parts; defaults to the system temp dir
# max_file_size_mb = 2
# max_files = 20

# [http.sendfile]
# root = "public"            # sendFile() containment; defaults to the entrypoint's directory

# Serve files from a directory before PHP. A miss falls through to PHP. Dotfiles always fall through to PHP.
# Requires "static" in http.middleware.
# The HTTP plugin caches up to 16 MiB of files. Each file must be at most 256 KiB. Entries stay fresh for one second.
# [http.static]
# root = "public"            # required; the directory must exist; relative paths resolve against this file's directory
# forbid = [".php"]          # file-name suffixes the server never serves; an explicit list replaces this default

# The worker pool behind the http listener. Each plugin owns its pool under [<plugin>.pool].
[http.pool]
entrypoint = "dispatcher-sync.php" # relative paths resolve against this file's directory
mode = "dispatcher"           # "classic" | "worker" | "dispatcher" (the default)
workers = 16                  # PHP interpreter threads; defaults to the CPU count
# max_requests = 0            # recycle the app of a worker after about N requests, with jitter; 0 means no limit
# max_boot_failures = 5       # exit 70 if one worker fails to boot N times in a row before its pool serves; 0 means no limit
# request_terminate_timeout_secs = 0  # wall-clock limit per unit; 0 disables it for this pool
# A positive limit in any pool reserves SIGRTMAX on systems that have it.
# After an interrupt, a native call can keep waiting. Exit 124 requires every worker of one pool to be blocked after 5 more seconds.
# execution_clock = "wall"    # the clock of PHP's max_execution_time: "wall" (the default) | "cpu" (the CPU time of the worker thread); has an effect only on Linux with per-thread PHP timers
# PHP reads these values through getenv(), $_ENV and $_SERVER. Child processes inherit the server environment.
# [http.pool.env]
# APP_ENV = "prod"

# The gRPC listener: unary and server-streaming calls over gRPC, gRPC-Web and Connect (crates/plugins/grpc/README.md).
# With a [grpc] table, grpc.descriptor_set and grpc.pool.entrypoint are required.
# [grpc]
# listen = "127.0.0.1:50051"   # host:port, ":port" for all interfaces, or "unix:/path"
# descriptor_set = "api.binpb" # relative to this file's directory, or an HTTP or HTTPS URL to load at boot
# services = ["billing.v1.InvoiceService"] # serve only these fully qualified names, each in descriptor_set; unset means the services of the files that no other file imports
# reflection = false           # serve grpc.reflection.v1 and v1alpha
# default_timeout_secs = 30    # deadline of a call without a client timeout; unset by default, which means no deadline
# max_timeout_secs = 60        # upper limit for a client timeout; unset by default, which means no limit
# keepalive_interval_secs = 10 # sends an HTTP/2 PING after this long without a request, request data or a PING answer
# keepalive_timeout_secs = 10  # closes the connection when the PING has no answer within this time
# interceptors = ["auth"]      # applied in list order; each listed interceptor needs its table

# The worker pool behind the grpc listener. It takes the keys of [http.pool].
# [grpc.pool]
# entrypoint = "grpc.php"      # relative paths resolve against this file's directory
# mode = "dispatcher"          # the only mode for a grpc pool
# workers = 16                 # defaults to the CPU count

# The bearer-token check. Requires "auth" in grpc.interceptors. grpc.health.v1.Health needs no token.
# [grpc.auth]
# tokens_file = "grpc-tokens"  # relative to this file's directory; one token per line

# The observability thread serves GET /metrics, /livez and /readyz.
# [observability]
# listen = "127.0.0.1:9180"    # required; host:port, ":port" for all interfaces, or "unix:/path"
# keepalive_timeout_secs = 60 # optional; closes a keep-alive connection idle past the limit
# [observability.metrics]    # GET /metrics
# [observability.probes]     # GET /livez, GET /readyz

# [server]
# pidfile = "rapira.pid"      # relative to this file's directory
# Exits 70, 101 and 124 can leave the pidfile. The next start overwrites it.
# stop_timeout_secs = 30      # time for plugins and PHP threads to stop
# io_threads = 2              # shared HTTP and gRPC IO threads; defaults to the Tokio runtime setting

[log]
# level = "error"             # error | warn | info | debug | trace
# format = "plain"            # or "json"
# [log.targets]               # per-target overrides; RUST_LOG replaces the whole filter
# php = "warn"                # shows PHP diagnostics even under a quieter level
