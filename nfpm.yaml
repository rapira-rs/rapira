name: "rapira-php${PHP_MINOR}"
arch: "${NFPM_ARCH}"
version: "${VERSION}"
release: "1"
section: "net"
maintainer: "Valery Piashchynski <piashchynski.valery@gmail.com>"
vendor: "rapira"
homepage: "https://github.com/rapira-rs/rapira"
license: "MIT"
description: |
  Rapira - PHP application server.
  Bundles an NTS PHP ${PHP_MINOR} embed runtime (libphp.so,
  common web extension set) under /usr/lib/rapira.
provides:
  - "rapira"
conflicts:
  - "rapira"
replaces:
  - "rapira"
contents:
  - src: "./dist/pkgroot-current/usr/bin/rapira"
    dst: "/usr/bin/rapira"
    file_info: { mode: 0755 }
  - src: "./dist/pkgroot-current/usr/lib/rapira/*.so*"
    dst: "/usr/lib/rapira/"
    file_info: { mode: 0644 }
  - src: "./LICENSE"
    dst: "/usr/share/doc/rapira/LICENSE"
    file_info: { mode: 0644 }
  - src: "./README.md"
    dst: "/usr/share/doc/rapira/README.md"
    file_info: { mode: 0644 }
overrides:
  deb:
    depends:
      - "libc6 (>= 2.34)"
      - "libgcc-s1"
      - "libstdc++6"
      - "libssl3 | libssl3t64"
      - "libcurl4 | libcurl4t64"
      - "zlib1g"
  rpm:
    depends:
      - "glibc >= 2.34"
      - "libgcc"
      - "libstdc++"
      - "openssl-libs"
      - "libcurl"
      - "zlib"
